SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in Speaker"

	EnableSequence [
		cset "name='Speaker Amp Master Playback Volume' 85,85"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 2
	}
}

SectionDevice."Microphone" {
	Comment "Built-in Stereo Microphone"

	EnableSequence [
		cset "name='CIC1 MUX' DMIC"
		cset "name='CIC2 MUX' DMIC"
		cset "name='DEC1 MUX' DMIC1"
		cset "name='DEC2 MUX' DMIC2"
		cset "name='TX1 Digital Volume' 102"
		cset "name='TX2 Digital Volume' 102"
	]

	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
		cset "name='DEC2 MUX' ZERO"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
		CaptureChannels 2
	}
}
