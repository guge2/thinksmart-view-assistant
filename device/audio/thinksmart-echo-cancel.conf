context.modules = [
    { name = libpipewire-module-echo-cancel
      args = {
        library.name = aec/libspa-aec-thinksmart
        monitor.mode = true
        # Match the ALSA graph: resample to 16 kHz only after AEC.
        # At 16 kHz the monitor reference was not waveform-aligned on this device.
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        # 1024-frame quanta at 48 kHz leave the following ALSA node enough
        # of its 4096-frame buffer to absorb ADSP pointer jitter.
        node.latency = 1440/48000
        # AEC3 estimates the acoustic delay; do not retain the old AEC delay offset.
        buffer.max_size = 100
        buffer.play_delay = 0/1000
        aec.args = {
          webrtc.high_pass_filter = true
          webrtc.noise_suppression = true
          # The custom adapter enables only digital AGC2, with a limiter.
          webrtc.gain_control = true
        }
        # Keep both microphone and speaker channels through AEC. Downmix only
        # after cancellation, so stereo music retains both echo references.
        sink.props = {
          target.object = "alsa_output.platform-c051000.sound-card.HiFi__hw_cd18781y_0__sink"
        }
        capture.props = {
          target.object = "alsa_input.platform-c051000.sound-card.HiFi__hw_cd18781y_1__source"
        }
        source.props = {
          node.name = "thinksmart.echo-cancel-source"
          node.description = "ThinkSmart Echo-Cancelled Microphone"
        }
      }
    }
]
